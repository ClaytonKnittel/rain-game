[package]
name = "rain-game"
version = "0.1.0"
edition = "2021"
exclude = ["dist", "assets"]

[dependencies]
bevy = { version = "0.15.3", default-features = false, features = ["bevy_asset", "bevy_sprite", "bevy_window", "bevy_winit", "bevy_render", "webgl2", "png", "jpeg", "x11", "bevy_text", "bevy_ui"] }
fastrand = "2.3.0"
googletest = "0.14.0"
ordered-float = "5.0.0"
bevy-world-space = { git = "https://github.com/ClaytonKnittel/bevy-world-space.git", rev = "7ca4ec1a83bd4420b7eda2f2fc279cf556e30e2b" }

[profile.dev.package."*"]
opt-level = 3

# Trunk does not support custom profiles.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Release profile for non-web applications.
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true
